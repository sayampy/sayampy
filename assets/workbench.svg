    <circle cx="865" cy="155" r="4"/><circle cx="900" cy="147" r="4"/><circle cx="935" cy="162" r="4"/><circle cx="974" cy="145" r="4"/><circle cx="1010" cy="157" r="4"/><circle cx="1052" cy="147" r="4"/><circle cx="916" cy="178" r="3"/><circle cx="993" cy="177" r="3"/>
