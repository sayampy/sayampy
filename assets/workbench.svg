    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20291f"/>
      <stop offset="1" stop-color="#171d18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#121612"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <path d="M0 286H1200" stroke="#394238" stroke-width="1"/>
